name: Reusable CI
on:
  workflow_call:
    inputs:
      node-versions:
        type: string
        default: '[22, 24]'
 
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: npm run lint
      - run: npm run format:check
 
  test:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ${{ fromJSON(inputs.node-versions) }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - name: 上傳測試報告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-node${{ matrix.node }}
          path: reports/
          retention-days: 7
      - name: 失敗摘要
        if: failure()
        env:
          NODE: ${{ matrix.node }}
        run: |
          {
            echo "### 測試失敗（Node $NODE）"
            echo "請下載 Artifact「test-report-node$NODE」查看詳細報告。"
          } >> "$GITHUB_STEP_SUMMARY"
 
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
